services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: rutea-postgres

    environment:
      - POSTGRES_DB=rutea
      - POSTGRES_USER=rutea
      - POSTGRES_PASSWORD=rutea_dev

    ports:
      - "5432:5432"

    volumes:
      - rutea_postgres_data:/var/lib/postgresql

volumes:
  rutea_postgres_data: